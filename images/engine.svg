<text x="288" y="82" font-size="21" font-weight="500">Test in parallel</text>
<text x="288" y="116" font-size="16" fill="#5f6368">Software and simulation</text>
<text x="288" y="142" font-size="16" fill="#1a73e8">Real FPGA boards</text>
<text x="288" y="168" font-size="16" fill="#5f6368">Measure and improve</text>
