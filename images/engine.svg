<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-labelledby="t d">
<title id="t">One system, parallel experiments, shared learning</title>
<desc id="d">The system we are building: parallel agent research feeds experiments in software and on real FPGA boards, then a selected live trading portfolio. Shared learning improves the next round.</desc>
