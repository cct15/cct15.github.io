<text x="26" y="82" font-size="21" font-weight="500">Parallel discovery</text>
<text x="26" y="116" font-size="16" fill="#5f6368">Strategies and markets</text>
<text x="26" y="142" font-size="16" fill="#5f6368">Models and hardware</text>
<text x="26" y="168" font-size="16" fill="#5f6368">Reusable infrastructure</text>
